# Public documentation is curated from docs-site/. Internal material under
# docs/ is intentionally not published by MkDocs.

site_name: Concordia DAO Council
site_url: https://docs.concordiadao.xyz/
site_description: >-
  Concordia V1.5 is an evidence-first governance council with deterministic
  policy, human approval, V1 receipts, quorum proof, and recorded SafePay Lite
  native-CSPR evidence on Casper Testnet.

repo_url: https://github.com/asadvendor-boop/concordia-dao-council
repo_name: concordia-dao-council
edit_uri: ""

docs_dir: docs-site

exclude_docs: |
  drafts/
  internal/
  *.draft.md
  *.tmp
  *.orig
  *.bak

validation:
  omitted_files: warn
  absolute_links: warn
  unrecognized_links: warn
  anchors: warn

theme:
  name: material
  custom_dir: docs-site/.overrides
  palette:
    - media: "(prefers-color-scheme: light)"
      scheme: default
      primary: deep purple
      accent: deep purple
      toggle:
        icon: material/weather-night
        name: Switch to dark mode
    - media: "(prefers-color-scheme: dark)"
      scheme: slate
      primary: deep purple
      accent: deep purple
      toggle:
        icon: material/weather-sunny
        name: Switch to light mode
  features:
    - navigation.footer
    - navigation.sections
    - navigation.top
    - content.code.copy
    - toc.integrate

plugins:
  - search

markdown_extensions:
  - admonition
  - attr_list
  - tables
  - toc:
      permalink: true
  - pymdownx.details
  - pymdownx.highlight:
      anchor_linenums: true
  - pymdownx.inlinehilite
  - pymdownx.superfences

nav:
  - Product Overview: index.md
  - Judge Quickstart: judge-walkthrough.md
  - Architecture & Trust Boundaries: architecture.md
  - Agent & Role Taxonomy: agent-taxonomy.md
  - V1 Receipts & Quorum: governance-receipts.md
  - SafePay Lite Record: safepay-lite.md
  - Proof Verification: proof-verification.md
  - Verifier SDK / CLI: verifier-cli.md
  - Policy Matrix: policy-matrix.md
  - Deployment & Security: deployment-security.md
  - Public Receipts: links.md
  - V1.5 Release Scope: release-scope.md
